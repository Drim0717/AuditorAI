<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Inner White Ticket Canvas -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#f8fafc" filter="url(#shadow)" />
  
  <!-- 2x2 Grid Lines -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#94a3b8" stroke-width="6" stroke-dasharray="10 8" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#94a3b8" stroke-width="6" stroke-dasharray="10 8" />
  
  <!-- Quadrant 1 check & lotto text -->
  <rect x="106" y="106" width="60" height="24" rx="6" fill="#dbeafe" />
  <text x="114" y="123" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">NY AM</text>
  <text x="108" y="180" font-family="monospace" font-size="28" font-weight="900" fill="#1e3a8a">22-5</text>
  <circle cx="216" cy="216" r="28" fill="none" stroke="#2563eb" stroke-width="6" />
  <text x="216" y="226" font-family="monospace" font-size="26" font-weight="900" fill="#2563eb" text-anchor="middle">30</text>
  
  <!-- Quadrant 2 text -->
  <rect x="276" y="106" width="60" height="24" rx="6" fill="#dbeafe" />
  <text x="284" y="123" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">FL AM</text>
  <text x="278" y="180" font-family="monospace" font-size="28" font-weight="900" fill="#1e3a8a">44-2</text>
  <circle cx="386" cy="216" r="28" fill="none" stroke="#2563eb" stroke-width="6" />
  <text x="386" y="226" font-family="monospace" font-size="26" font-weight="900" fill="#2563eb" text-anchor="middle">50</text>

  <!-- Big Verified Badge Centered -->
  <circle cx="256" cy="256" r="48" fill="#10b981" filter="url(#shadow)" />
  <path d="M236 256 l14 14 l28 -28" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
